# =============================================================================
# ticketz + EvoHub  —  stack de produção pro Portainer (perfil "acme")
# =============================================================================
# É o docker-compose-acme.yaml do ticketz (idêntico). Ele COMPILA backend e
# frontend a partir do código-fonte -> quando o Portainer construir do SEU FORK,
# as mudanças do EvoHub já entram na imagem.
#
# COMO USAR NO PORTAINER (resumo — passo a passo completo no guia .docx):
#   1. Deve rodar a partir da RAIZ do repositório (usa ./backend, ./frontend,
#      ./confs). No Portainer: Stacks > Add stack > "Repository", aponte pro seu
#      fork e informe o caminho deste arquivo.
#   2. Preencha .env-backend-acme e .env-frontend-acme (entregues junto) com seu
#      domínio e os tokens do EvoHub. Eles precisam estar na raiz do repo.
#   3. O DNS do seu domínio (FRONTEND_HOST) tem que apontar pro servidor: o
#      Nginx + acme-companion emitem o SSL (Let's Encrypt) sozinhos.
#   4. Portas 80/443 precisam estar livres no host. Se você JÁ tem um proxy
#      (Traefik/NPM) nessas portas, veja a seção "sem proxy próprio" no guia.
# =============================================================================

networks:
  ticketz:
  nginx-proxy:

volumes:
  ngx_conf:
  ngx_vhost:
  ngx_html:
  ngx_dhparam:
  ngx_certs:
  ngx_acme:
  redis_data:
  postgres_data:
  backend_public:
  backend_private:

services:

  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: ticketz-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ngx_conf:/etc/nginx/conf.d
      - ngx_vhost:/etc/nginx/vhost.d
      - ngx_html:/usr/share/nginx/html
      - ngx_dhparam:/etc/nginx/dhparam
      - ngx_certs:/etc/nginx/certs:ro
      - ./confs/nginx-ticketz.conf:/etc/nginx/conf.d/ticketz.conf
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - nginx-proxy

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: ticketz-acme-companion
    restart: always
    depends_on:
      - nginx-proxy
    volumes:
      - ngx_vhost:/etc/nginx/vhost.d
      - ngx_html:/usr/share/nginx/html
      - ngx_dhparam:/etc/nginx/dhparam:ro
      - ngx_certs:/etc/nginx/certs
      - ngx_acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - NGINX_PROXY_CONTAINER=ticketz-nginx-proxy
    networks:
      - nginx-proxy

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    volumes:
      - backend_public:/usr/src/app/public
      - backend_private:/usr/src/app/private
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/root/.docker/config.json:ro
    env_file:
      - .env-backend-acme
    restart: always
    depends_on:
      - acme-companion
      - postgres
      - redis
    networks:
      - ticketz
      - nginx-proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    env_file:
      - .env-frontend-acme
    volumes:
      - backend_public:/var/www/backend-public/
    restart: always
    depends_on:
      - acme-companion
      - backend
    networks:
      - ticketz
      - nginx-proxy

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ticketz}
      - POSTGRES_DB=${POSTGRES_DB:-ticketz}
      - POSTGRES_HOST_AUTH_METHOD=trust
      - TZ=${TZ:-America/Sao_Paulo}
    expose:
      - 5432
    restart: always
    networks:
      - ticketz

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    expose:
      - 6379
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - ticketz
