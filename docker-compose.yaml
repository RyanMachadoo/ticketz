# =============================================================================
# ticketz + EvoHub — stack de produção para Portainer
# =============================================================================

networks:
  ticketz:
  nginx-proxy:

volumes:
  ngx_conf:
  ngx_vhost:
  ngx_html:
  ngx_dhparam:
  ngx_certs:
  ngx_acme:
  redis_data:
  postgres_data:
  backend_public:
  backend_private:

services:

  # ===========================================================================
  # NGINX PROXY
  # ===========================================================================
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: ticketz-nginx-proxy
    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ngx_conf:/etc/nginx/conf.d
      - ngx_vhost:/etc/nginx/vhost.d
      - ngx_html:/usr/share/nginx/html
      - ngx_dhparam:/etc/nginx/dhparam
      - ngx_certs:/etc/nginx/certs:ro

      - /var/run/docker.sock:/tmp/docker.sock:ro

    networks:
      - nginx-proxy


  # ===========================================================================
  # ACME / LET'S ENCRYPT
  # ===========================================================================
  #
  # OBS:
  # O Caddy externo é quem gerencia o certificado público do domínio.
  # Este ACME Companion fica mantido porque faz parte da arquitetura original
  # do Ticketz/nginx-proxy.
  #
  # Não coloque LETSENCRYPT_HOST no frontend enquanto o Caddy estiver na frente.
  #
  # ===========================================================================
  acme-companion:
    image: nginxproxy/acme-companion
    container_name: ticketz-acme-companion
    restart: always

    depends_on:
      - nginx-proxy

    volumes:
      - ngx_vhost:/etc/nginx/vhost.d
      - ngx_html:/usr/share/nginx/html
      - ngx_dhparam:/etc/nginx/dhparam:ro
      - ngx_certs:/etc/nginx/certs
      - ngx_acme:/etc/acme.sh

      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      NGINX_PROXY_CONTAINER: ticketz-nginx-proxy

    networks:
      - nginx-proxy


  # ===========================================================================
  # BACKEND
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile

    volumes:
      - backend_public:/usr/src/app/public
      - backend_private:/usr/src/app/private

      - /var/run/docker.sock:/var/run/docker.sock

      - ~/.docker/config.json:/root/.docker/config.json:ro

    env_file:
      - .env-backend-acme

    restart: always

    depends_on:
      - postgres
      - redis

    networks:
      - ticketz
      - nginx-proxy


  # ===========================================================================
  # FRONTEND
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile

    env_file:
      - .env-frontend-acme

    volumes:
      - backend_public:/var/www/backend-public/

    restart: always

    depends_on:
      - backend

    networks:
      - ticketz
      - nginx-proxy


  # ===========================================================================
  # POSTGRESQL
  # ===========================================================================
  #
  # IMPORTANTE:
  # O volume postgres_data precisa estar vazio na primeira inicialização
  # para estas variáveis serem aplicadas.
  #
  # Usuário: comunica
  # Banco:   comunica
  #
  # ===========================================================================
  postgres:
    image: postgres:16-alpine

    volumes:
      - postgres_data:/var/lib/postgresql/data

    environment:
      POSTGRES_USER: comunica
      POSTGRES_DB: comunica
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: ${TZ:-America/Sao_Paulo}

    expose:
      - "5432"

    restart: always

    networks:
      - ticketz


  # ===========================================================================
  # REDIS
  # ===========================================================================
  redis:
    image: redis:7-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"

    expose:
      - "6379"

    volumes:
      - redis_data:/data

    restart: always

    networks:
      - ticketz